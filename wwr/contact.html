<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting Company</title>
    <meta name="description"
      content="This is the HTML about the page of the white water rafting and the trip and how you can enjoy with a friend">
    <meta name="Author" content="Adonis Lebron">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/rift.jpeg" alt="rift image logo" width="130" height="130">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.hml">Contact us</a></li>
            </ul>
        </nav>
    </header>
    
<!-- Company Information -->

<section class="company-info">
        <h1>Contact Us</h1>
        <p>Parque Nacional</p>
        <p>Bonao</p>
        <p>+1 (809) 555-1234</p>
        <p>Inf@riftboatwater.com</p>
</section>

<!-- Contact Form and Map -->
<section class="contact-section">

        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3772.571381041524!2d-70.45844677136289!3d18.99452769602732!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8eafdf510d300877%3A0xba385769fbb81493!2sSaltos%20De%20Jima!5e0!3m2!1ses-419!2sdo!4v1771540286627!5m2!1ses-419!2sdo" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <p>Message Purpose</p>

            
            <label for="general">General Inquiry</label>
            <input type="radio" id="general" name="purpose" value="general">

            
            <label for="reservation">Reservation Question</label>
            <input type="radio" id="reservation" name="purpose" value="reservation">

            
            <label for="website">Website Suggestion</label>
            <input type="radio" id="website" name="purpose" value="website">

            <label for="message">Message:</label>

            <textarea id="message" name="message" rows="4" required></textarea>
            <label for="checkbox">Please Subscribe me to the monthly newsletter</label>

            <button type="submit">Get in Touch!</button>
        </form>

        <!-- Employees Section -->
        <section class="Employees">
            <h2>We Are here to Serve you!</h2>

            <div class="employee-list">
            <figure>
                <img src="images/jose.jpeg" alt="Jose Angel" width="150" height="150">
                <figcaption>Jose Angel</figcaption>
            </figure>

                <figure>
                <img src="images/Adonis Lebron.jpeg" alt="Adonis Lebron" width="150" height="150">
                <figcaption>Adonis Lebron</figcaption>
                </figure>

                <figure>
                <img src="images/joton.jpeg" alt="Jhonston Jaquez" width="150" height="150">
                <figcaption>Jhonston Jaquez</figcaption>
                </figure>
            </figure>
            </div>
        </section>
    </main>

    <!-- Footer with Social Media Links -->
    <footer>
        <p> Footer content including Social Media Icons/Links</p>
        <nav class="socialmedia"></nav>
        <a href="https://facebook.com">
            <img src="images/facebook.svg" alt="Facebook Icom" width="" height="75">
        </a>
        <a href="https://instagram.com">
            <img src="images/instagram.svg" alt="Instagram Icom" width="75" height="75">
        </a>
        <a href="https://x.com">
            <img src="images/x-bw.svg" alt="X Icom" width="75" height="75">
        </a>
        </nav>
    </footer>
    
</body>

</html>
