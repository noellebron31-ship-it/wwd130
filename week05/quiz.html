<body>
    <header>Quiz</header>
    <h1>Basic HTML and CSS Quiz</h1>

    <main>
        <form>
            <label for="Q1">1. Which HTML tag is used to create a hyperlink?</label>
            <input type="text" id="Q1" name="Q1">

                element?</label>

                <option value="0">Choose one ...</option>
                <option value="1">A. font-color</option>
                <option value="2">B. text-color</option>
                <option value="3">C. color</option>
                <option value="4">D. foreground</option>
            </select>
            <label for="Q4">4. How many different heading levels are available in HTML?</label>
            <input type="number" id="Q4" name="Q4">
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
